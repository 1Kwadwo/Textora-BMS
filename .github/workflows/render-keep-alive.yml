name: Render Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /health
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Missing GitHub repository secret: RENDER_SERVICE_URL"
            echo "Set it to your Render service URL, for example: https://textora-bms.onrender.com"
            exit 1
          fi

          SERVICE_URL="${RENDER_SERVICE_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$SERVICE_URL/health"
