<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="calcGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3b82f6" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="480" height="360" rx="10" fill="#f8fafc" stroke="#1e60eb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="10" y="10" width="480" height="360" rx="10" fill="url(#calcGrid)"/>

  <!-- Bar Chart Columns -->
  <rect x="60" y="220" width="40" height="120" rx="4" fill="#dbeafe"/>
  <rect x="120" y="170" width="40" height="170" rx="4" fill="#93c5fd"/>
  <rect x="180" y="120" width="40" height="220" rx="4" fill="#3b82f6"/>
  <rect x="240" y="70" width="40" height="270" rx="4" fill="#1e60eb"/>

  <!-- Value Tags over Bars -->
  <text x="65" y="210" fill="#1e60eb" font-family="monospace" font-size="10" font-weight="bold">400</text>
  <text x="125" y="160" fill="#1e60eb" font-family="monospace" font-size="10" font-weight="bold">1.0K</text>
  <text x="185" y="110" fill="#1e60eb" font-family="monospace" font-size="10" font-weight="bold">2.0K</text>
  <text x="245" y="60" fill="#1e60eb" font-family="monospace" font-size="10" font-weight="bold">10K+</text>

  <!-- Big Cedi Coin / Savings Badge -->
  <g>
    <circle cx="380" cy="130" r="45" fill="#1e60eb" stroke="#0f172a" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(30,96,235,0.2))"/>
    <circle cx="380" cy="130" r="38" fill="#ffffff" stroke="#1e60eb" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="362" y="140" fill="#1e60eb" font-family="sans-serif" font-size="28" font-weight="bold">GH₵</text>
    <text x="350" y="195" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">0.05 / SMS</text>
    <text x="345" y="210" fill="#64748b" font-family="sans-serif" font-size="10">No monthly fees</text>
  </g>

  <!-- Character calculating -->
  <path d="M 330 340 L 345 270 L 370 270 L 375 340 Z" fill="#0f172a"/>
  <path d="M 335 270 L 350 200 L 390 200 L 395 270 Z" fill="#1e60eb"/>
  <circle cx="370" cy="180" r="14" fill="#fed7aa"/>
  <path d="M 360 175 C 360 162 385 162 388 175 Z" fill="#0f172a"/>

  <!-- Base Line -->
  <line x1="20" y1="340" x2="480" y2="340" stroke="#0f172a" stroke-width="2"/>
</svg>
