<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="sidGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#3b82f6" stroke-width="0.7" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="480" height="360" rx="10" fill="#f8fafc" stroke="#1e60eb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="10" y="10" width="480" height="360" rx="10" fill="url(#sidGrid)"/>

  <!-- Phone Mockup with Custom Sender ID SMS -->
  <rect x="50" y="40" width="180" height="280" rx="20" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="drop-shadow(0 12px 24px rgba(15,23,42,0.15))"/>
  <!-- Phone Notch & Speaker -->
  <rect x="110" y="52" width="60" height="6" rx="3" fill="#0f172a"/>
  
  <!-- Sender ID Header Bubble -->
  <rect x="65" y="75" width="150" height="35" rx="6" fill="#1e60eb"/>
  <circle cx="85" cy="92" r="10" fill="#ffffff"/>
  <text x="81" y="96" fill="#1e60eb" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
  <text x="105" y="93" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">YOUR_BRAND</text>
  <text x="105" y="103" fill="#93c5fd" font-family="monospace" font-size="8">VERIFIED CARRIER ID</text>

  <!-- SMS Message Bubble -->
  <rect x="65" y="125" width="150" height="90" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="75" y="145" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">KebSEND Alert</text>
  <text x="75" y="162" fill="#475569" font-family="sans-serif" font-size="9">Your order #78291 has</text>
  <text x="75" y="176" fill="#475569" font-family="sans-serif" font-size="9">been processed successfully!</text>
  <text x="75" y="195" fill="#1e60eb" font-family="sans-serif" font-size="8">14:02 • Delivered</text>

  <!-- Shield Verification Certificate Card -->
  <g>
    <rect x="260" y="60" width="200" height="140" rx="10" fill="#ffffff" stroke="#1e60eb" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(30,96,235,0.12))"/>
    <!-- Shield Icon -->
    <path d="M 300 80 L 325 70 L 350 80 C 350 105 325 125 325 125 C 325 125 300 105 300 80 Z" fill="#1e60eb"/>
    <path d="M 318 95 L 323 100 L 333 90" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="365" y="92" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Carrier Approved</text>
    <text x="365" y="106" fill="#64748b" font-family="sans-serif" font-size="9">11-Char Alphanumeric</text>
    
    <line x1="280" y1="140" x2="440" y2="140" stroke="#e2e8f0" stroke-width="1"/>
    <text x="280" y="162" fill="#1e60eb" font-family="monospace" font-size="10" font-weight="bold">✓ LOA Exemption Eligible</text>
    <text x="280" y="178" fill="#64748b" font-family="monospace" font-size="9">Direct NCA Whitelist</text>
  </g>

  <!-- Character pointing at Verified Badge -->
  <path d="M 360 340 L 375 270 L 400 270 L 405 340 Z" fill="#0f172a"/>
  <path d="M 365 270 L 380 200 L 420 200 L 425 270 Z" fill="#1e60eb"/>
  <circle cx="400" cy="180" r="14" fill="#fed7aa"/>
  <path d="M 390 175 C 390 162 415 162 418 175 Z" fill="#0f172a"/>
  <path d="M 370 220 L 320 180 L 328 170 L 380 210 Z" fill="#1e60eb"/>
  <circle cx="316" cy="176" r="6" fill="#fed7aa"/>

  <!-- Base Line -->
  <line x1="20" y1="340" x2="480" y2="340" stroke="#0f172a" stroke-width="2"/>
</svg>
