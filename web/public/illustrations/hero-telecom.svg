<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <!-- Blueprint Background Sub-grid -->
  <defs>
    <pattern id="heroGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3b82f6" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e60eb"/>
      <stop offset="100%" stop-color="#0f3ba0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e60eb"/>
    </linearGradient>
  </defs>

  <!-- Technical Axis and Base Platform -->
  <rect x="20" y="20" width="560" height="410" rx="12" fill="#0f172a" fill-opacity="0.04" stroke="#1e60eb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="20" y="20" width="560" height="410" rx="12" fill="url(#heroGrid)"/>
  
  <!-- Technical Dimension Markers -->
  <text x="35" y="45" fill="#1e60eb" font-family="monospace" font-size="11" font-weight="bold">KebSEND</text>
  <text x="455" y="45" fill="#1e60eb" font-family="monospace" font-size="11" font-weight="bold">GHANA &amp; GLOBAL</text>
  <line x1="30" y1="410" x2="570" y2="410" stroke="#0f172a" stroke-width="2"/>

  <!-- Tower / Base Station -->
  <path d="M 120 410 L 160 140 L 180 140 L 220 410 Z" fill="#1e293b"/>
  <line x1="135" y1="330" x2="205" y2="330" stroke="#60a5fa" stroke-width="3"/>
  <line x1="145" y1="250" x2="195" y2="250" stroke="#60a5fa" stroke-width="3"/>
  <line x1="155" y1="180" x2="185" y2="180" stroke="#60a5fa" stroke-width="3"/>
  <!-- Cross Braces -->
  <line x1="135" y1="410" x2="205" y2="330" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="205" y1="410" x2="135" y2="330" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="135" y1="330" x2="195" y2="250" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="205" y1="330" x2="145" y2="250" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Antenna Dome & Waves -->
  <rect x="165" y="115" width="10" height="25" fill="#1e60eb"/>
  <circle cx="170" cy="110" r="14" fill="url(#blueGrad)"/>
  <circle cx="170" cy="110" r="6" fill="#ffffff"/>
  
  <!-- Pulse Wave Arcs -->
  <path d="M 195 90 A 35 35 0 0 1 195 130" stroke="#1e60eb" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 215 75 A 60 60 0 0 1 215 145" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="5,3" stroke-linecap="round" fill="none"/>
  <path d="M 235 60 A 85 85 0 0 1 235 160" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round" fill="none"/>

  <!-- Floating SMS Packet Card 1 -->
  <g class="packet-float-1">
    <rect x="260" y="100" width="190" height="70" rx="8" fill="#ffffff" stroke="#1e60eb" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(30,96,235,0.15))"/>
    <circle cx="285" cy="135" r="14" fill="#1e60eb"/>
    <path d="M 279 135 L 284 140 L 293 130" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="128" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">SMS Dispatched</text>
    <text x="310" y="145" fill="#1e60eb" font-family="monospace" font-size="10">+233 24 000 1234</text>
    <rect x="415" y="112" width="26" height="14" rx="3" fill="#dbeafe"/>
    <text x="420" y="122" fill="#1e60eb" font-family="sans-serif" font-size="8" font-weight="bold">GSM</text>
  </g>

  <!-- Floating SMS Packet Card 2 -->
  <g class="packet-float-2">
    <rect x="330" y="200" width="210" height="75" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(15,23,42,0.1))"/>
    <rect x="345" y="215" width="32" height="32" rx="6" fill="#0f172a"/>
    <path d="M 353 226 L 369 226 M 353 231 L 365 231 M 353 236 L 361 236" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="388" y="232" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">API Gateway: 200 OK</text>
    <text x="388" y="248" fill="#64748b" font-family="monospace" font-size="10">Units: 1.00 | Bal: 399.00</text>
  </g>

  <!-- Flat Vector Engineer Character (Corporate Memphis Style in Blueprint Colors) -->
  <!-- Legs -->
  <path d="M 255 410 L 270 340 L 290 340 L 285 410 Z" fill="#0f172a"/>
  <path d="M 295 410 L 305 340 L 325 340 L 320 410 Z" fill="#1e293b"/>
  <!-- Shoes -->
  <path d="M 250 410 L 285 410 L 285 418 L 245 418 Z" fill="#1e60eb"/>
  <path d="M 290 410 L 325 410 L 325 418 L 285 418 Z" fill="#1e60eb"/>
  
  <!-- Torso (Blueprint Coat) -->
  <path d="M 260 340 L 280 250 L 330 250 L 335 340 Z" fill="url(#blueGrad)"/>
  <path d="M 295 250 L 295 340" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Arm pointing to Antenna -->
  <path d="M 280 265 L 230 220 L 220 230 L 265 285 Z" fill="#1e60eb"/>
  <!-- Hand -->
  <circle cx="218" cy="225" r="7" fill="#fed7aa"/>
  
  <!-- Laptop in other hand -->
  <path d="M 325 270 L 360 295 L 345 315 L 315 290 Z" fill="#1e60eb"/>
  <rect x="340" y="280" width="30" height="20" rx="3" fill="#0f172a" transform="rotate(-15, 355, 290)"/>
  <rect x="343" y="283" width="24" height="14" rx="2" fill="#60a5fa" transform="rotate(-15, 355, 290)"/>

  <!-- Head & Hair -->
  <circle cx="305" cy="225" r="16" fill="#fed7aa"/>
  <!-- Stylized Hair -->
  <path d="M 295 220 C 295 205 320 205 322 220 C 322 215 310 210 295 220 Z" fill="#0f172a"/>
  <!-- Glasses / Specs -->
  <rect x="298" y="222" width="10" height="6" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="308" y1="225" x2="312" y2="225" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="312" y="222" width="10" height="6" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Target Routing Indicator -->
  <circle cx="480" cy="330" r="30" stroke="#1e60eb" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="480" cy="330" r="16" fill="#dbeafe"/>
  <circle cx="480" cy="330" r="6" fill="#1e60eb"/>
  <text x="440" y="375" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold">190+ COUNTRIES</text>
</svg>
