<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <!-- Blueprint sub-grid -->
  <defs>
    <pattern id="apiGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#3b82f6" stroke-width="0.7" stroke-opacity="0.25"/>
    </pattern>
    <linearGradient id="apiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e60eb"/>
      <stop offset="100%" stop-color="#1855d1"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="480" height="360" rx="10" fill="#f8fafc" stroke="#1e60eb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="10" y="10" width="480" height="360" rx="10" fill="url(#apiGrid)"/>

  <!-- Code Terminal Window -->
  <rect x="40" y="40" width="280" height="180" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- Window Header -->
  <rect x="40" y="40" width="280" height="26" rx="8" fill="#1e293b"/>
  <circle cx="55" cy="53" r="4" fill="#ef4444"/>
  <circle cx="67" cy="53" r="4" fill="#eab308"/>
  <circle cx="79" cy="53" r="4" fill="#22c55e"/>
  <text x="100" y="57" fill="#94a3b8" font-family="monospace" font-size="10">POST /api/v1/send-sms</text>

  <!-- Terminal Syntax Lines -->
  <text x="55" y="85" fill="#60a5fa" font-family="monospace" font-size="10">curl -X POST \</text>
  <text x="55" y="105" fill="#94a3b8" font-family="monospace" font-size="10">  -H <tspan fill="#38bdf8">"Authorization: Bearer ksnd_..."</tspan> \</text>
  <text x="55" y="125" fill="#94a3b8" font-family="monospace" font-size="10">  -d '{<tspan fill="#a7f3d0">"to"</tspan>: <tspan fill="#fed7aa">"233240001234"</tspan>, </text>
  <text x="75" y="145" fill="#a7f3d0" font-family="monospace" font-size="10">"message"</tspan><text x="135" y="145" fill="#94a3b8" font-family="monospace" font-size="10">: <tspan fill="#fed7aa">"Your OTP: 9482"</tspan>}'</text>
  <rect x="55" y="165" width="250" height="24" rx="4" fill="#1e293b"/>
  <text x="65" y="181" fill="#4ade80" font-family="monospace" font-size="10">✔ 200 OK — message accepted</text>

  <!-- Developer Character -->
  <path d="M 330 350 L 350 250 L 380 250 L 390 350 Z" fill="#0f172a"/>
  <!-- Torso -->
  <path d="M 340 250 L 360 170 L 410 170 L 420 250 Z" fill="url(#apiBlue)"/>
  <!-- Head -->
  <circle cx="385" cy="140" r="16" fill="#fed7aa"/>
  <path d="M 370 135 C 370 120 400 120 405 135 Z" fill="#0f172a"/>
  <!-- Hand typing on Desk -->
  <path d="M 360 200 L 320 230 L 330 240 L 375 210 Z" fill="#1e60eb"/>
  <circle cx="315" cy="235" r="6" fill="#fed7aa"/>

  <!-- API Key Shield / Token Card -->
  <g>
    <rect x="300" y="60" width="160" height="85" rx="8" fill="#ffffff" stroke="#1e60eb" stroke-width="2" filter="drop-shadow(0 6px 12px rgba(30,96,235,0.12))"/>
    <circle cx="325" cy="85" r="12" fill="#1e60eb"/>
    <path d="M 320 85 L 324 89 L 331 81" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="345" y="82" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">API Key Active</text>
    <text x="345" y="96" fill="#64748b" font-family="monospace" font-size="9">Rate: 100 req/s</text>
    <line x1="315" y1="110" x2="445" y2="110" stroke="#e2e8f0" stroke-width="1"/>
    <text x="315" y="128" fill="#1e60eb" font-family="monospace" font-size="10" font-weight="bold">Balance: 2,000 GHS</text>
  </g>

  <!-- Technical base -->
  <line x1="20" y1="350" x2="480" y2="350" stroke="#0f172a" stroke-width="2"/>
</svg>
